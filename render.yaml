services:
  - type: web
    name: ocean-spy-buoy
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MODE
        value: SIMULATION
      - key: DATABASE_URL
        value: sqlite:///./ocean_spy_buoy.db
      - key: PYTHON_VERSION
        value: 3.11.9
